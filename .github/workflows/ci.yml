name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Run checks
        run: bun run check --verbose
      - name: Run shell script tests
        run: bun run test:shell
      - name: Check for generated changes
        run: git diff --exit-code
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  e2e:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    name: End-to-end tests (${{ matrix.runtime }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      SANDBOX_TEST_RUNTIME: ${{ matrix.runtime }}
      SANDBOX_TEST_TMP: /tmp/sandbox-e2e
    steps:
      - name: Free disk space for container images
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Sandbox
        run: bun run build
      - name: Set up rootless Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install --yes uidmap slirp4netns fuse-overlayfs
          mkdir -p "$HOME/.config/containers"
          printf 'unqualified-search-registries = ["docker.io"]\n' > "$HOME/.config/containers/registries.conf"
          podman info
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          runroot=$(podman info --format '{{.Store.RunRoot}}')
          printf '[storage]\ndriver = "overlay"\nrootless_storage_path = "%s"\nrunroot = "%s"\n[storage.options.overlay]\nmount_program = "/usr/bin/fuse-overlayfs"\n' "$graphroot" "$runroot" > "$RUNNER_TEMP/podman-storage.conf"
          export CONTAINERS_STORAGE_CONF="$RUNNER_TEMP/podman-storage.conf"
          echo "CONTAINERS_STORAGE_CONF=$CONTAINERS_STORAGE_CONF" >> "$GITHUB_ENV"
          podman info
          test "$(podman info --format '{{index .Store.GraphStatus "Supports shifting"}}')" = true
      - name: Check Docker
        if: matrix.runtime == 'docker'
        run: docker info
      - name: Build test images
        env:
          SANDBOX_CONFIG_DIR: ${{ runner.temp }}/sandbox-build-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SANDBOX_CONFIG_DIR"
          printf 'runtime = "%s"\n' "$SANDBOX_TEST_RUNTIME" > "$SANDBOX_CONFIG_DIR/config.toml"
          ./dist/apps/sandbox/main.js --trust --verbose build
      - name: Run end-to-end tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run test:e2e
      - name: Show runtime diagnostics
        if: failure()
        run: |
          timeout --kill-after=5s 15s ${{ matrix.runtime }} info || echo '::warning::Runtime info failed or timed out'
          timeout --kill-after=5s 15s ${{ matrix.runtime }} ps --all || echo '::warning::Container listing failed or timed out'
          timeout --kill-after=5s 15s ${{ matrix.runtime }} images || echo '::warning::Image listing failed or timed out'
          df -h
