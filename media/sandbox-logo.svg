      <path d="M451 415 C443 471 472 526 516 542 Q535 549 558 549 L694 549 Q727 549 749 534 C792 508 809 464 800 411" fill="none" stroke="#755891" stroke-width="12" opacity=".38" filter="url(#blur-highlight)"/>
      <path d="M454 388 C467 345 499 315 537 305" fill="none" stroke="#ffffff" stroke-width="15" opacity=".8" filter="url(#blur-highlight)"/>
    </g>
    <path id="face-window" d="M558 348 C511 348 477 383 477 430 C477 477 510 513 557 514 L691 514 C737 514 770 478 771 432 C771 389 736 349 694 348Z" fill="url(#face)" stroke="#c3b5dd" stroke-width="1.5"/>
    <path id="face-upper-seam" d="M558 348 C511 348 477 383 477 430 C477 477 510 513 557 514 L691 514 C737 514 770 478 771 432 C771 389 736 349 694 348Z" fill="none" stroke="url(#face-seam-fade)" stroke-width="2.5"/>
