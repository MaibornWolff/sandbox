name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Run checks
        run: bun run check --verbose
      - name: Run shell script tests
        run: bun run test:shell
      - name: Check for generated changes
        run: git diff --exit-code
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SANDBOX_TEST_RUNTIME: docker
      SANDBOX_TEST_TMP: /tmp/sandbox-e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Sandbox
        run: bun run build
      - name: Build test images
        run: ./dist/apps/sandbox/main.js --trust build
      - name: Run end-to-end tests
        run: bun run test:e2e
