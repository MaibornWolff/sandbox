name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate and pack without publishing or changing GitHub
        required: true
        type: boolean
        default: true
      candidate_run_id:
        description: Reuse the validated candidate from a successful Release run (optional)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare immutable candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      source_commit: ${{ github.sha }}
      candidate_run_id: ${{ steps.metadata.outputs.candidate_run_id }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ]; then
            echo "::error::Run releases from main only"
            exit 1
          fi
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify reusable candidate origin
        if: inputs.candidate_run_id != ''
        uses: actions/github-script@v8
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        with:
          script: |
            const value = process.env.CANDIDATE_RUN_ID;
            if (!/^[1-9][0-9]*$/.test(value)) throw new Error('Candidate run ID must be a positive integer');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(value) });
            const { data: workflow } = await github.rest.actions.getWorkflow({ ...context.repo, workflow_id: 'release.yml' });
            const { assertReusableCandidate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pipeline-policy.mjs`);
            assertReusableCandidate(run, context.sha, workflow.id);
      - name: Download reusable candidate
        if: inputs.candidate_run_id != ''
        uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: .release/
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Prepare version and pack candidate
        if: inputs.candidate_run_id == ''
        run: |
          bun release prepare
          bun release pack
      - name: Verify candidate and record metadata
        id: metadata
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id || github.run_id }}
        run: |
          bun -e '
            const { appendFile } = await import("node:fs/promises");
            const { readReleasePlan, verifyReleaseTarball } = await import("./scripts/release-plan.ts");
            const { getRepoRootPath } = await import("./src/platform/git/index.ts");
            const root = await getRepoRootPath(process.cwd());
            const plan = await readReleasePlan(root);
            if (plan.sourceCommit !== process.env.GITHUB_SHA) {
              throw new Error("Candidate source does not match main");
            }
            await verifyReleaseTarball(root, plan);
            await appendFile(process.env.GITHUB_OUTPUT,
              `version=${plan.version}\ncandidate_run_id=${process.env.CANDIDATE_RUN_ID}\n`);
          '
      - name: Check for unexpected generated changes
        if: inputs.candidate_run_id == ''
        run: git diff --exit-code -- . ':!package.json' ':!CHANGELOG.md'
      - name: Upload immutable release candidate
        if: inputs.candidate_run_id == ''
        uses: actions/upload-artifact@v7
        with:
          name: npm-release-candidate
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Summarize candidate for review
        env:
          RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          CANDIDATE_RUN_ID: ${{ steps.metadata.outputs.candidate_run_id }}
        run: |
          printf '## Release candidate %s\n\nSource: %s\n\nCandidate run: %s\n\n' "$RELEASE_VERSION" "$GITHUB_SHA" "$CANDIDATE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          cat .release/notes.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\n### Integrity\n\n' >> "$GITHUB_STEP_SUMMARY"
          sha512sum .release/package.tgz >> "$GITHUB_STEP_SUMMARY"

  source-ci:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require successful CI for this main commit
        uses: actions/github-script@v8
        with:
          script: |
            const { waitForSourceCI } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/pipeline-policy.mjs`);
            await waitForSourceCI({ github, context, core });

  validate:
    name: Test packed candidate
    needs: prepare
    if: inputs.candidate_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download immutable candidate
        uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: .release/
      - name: Test installation and publishing without rebuilding
        run: bun release validate

  publish:
    name: Publish to npm
    needs: [prepare, source-ci, validate]
    if: >-
      always() && !cancelled() && !inputs.dry_run &&
      needs.prepare.result == 'success' && needs.source-ci.result == 'success' &&
      (needs.validate.result == 'success' ||
      (inputs.candidate_run_id != '' && needs.validate.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Recheck critical dependency vulnerabilities before publication
        run: bun run security
      - name: Download validated candidate
        uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: .release/
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Set up trusted-publishing npm CLI
        run: npm install --global npm@11
      - name: Publish the validated tarball if main is unchanged
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: bun release publish

  finalize:
    name: Commit release metadata and create GitHub Release
    needs: [prepare, publish]
    if: >-
      always() && !cancelled() &&
      needs.prepare.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-production
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.source_commit }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Download published candidate
        uses: actions/download-artifact@v8
        with:
          name: npm-release-candidate
          path: .release/
          run-id: ${{ needs.prepare.outputs.candidate_run_id }}
          github-token: ${{ github.token }}
      - name: Configure release commit author
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Commit version and changelog after publication
        run: bun release finalize
      - name: Create GitHub Release from maintained notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          tag="v$RELEASE_VERSION"
          releases=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if printf '%s\n' "$releases" | grep -Fxq "$tag"; then
            echo "GitHub Release $tag already exists"
          else
            gh release create "$tag" --verify-tag --title "$tag" --notes-file .release/notes.md
          fi
