    <path id="antenna-stem-shape" d="M614 247 630 247 630 290 Q622 294 614 290Z" fill="url(#antenna-stem)"/>
    <circle id="antenna-tip" cx="621.7" cy="228" r="26.5" fill="url(#antenna-ball)" stroke="#ff8bcf" stroke-width="1.4"/>
    <path d="M601 217 Q609 201 626 205" fill="none" stroke="#ffb1dd" stroke-width="2" opacity=".55"/>
  </g>
  <g transform="translate(3.5 0)" id="robot-hands" aria-label="Hands resting on the box rim">
