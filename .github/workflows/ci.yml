name: CI

on:
  workflow_dispatch:
    inputs:
      podman_debug:
        description: Run short Podman diagnostics instead of the full E2E suite
        type: boolean
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - name: Run checks
        run: bun run check --verbose
      - name: Run shell script tests
        run: bun run test:shell
      - name: Check for generated changes
        run: git diff --exit-code
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: warn

  e2e:
    if: ${{ !inputs.podman_debug }}
    name: End-to-end tests (${{ matrix.runtime }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      SANDBOX_TEST_RUNTIME: ${{ matrix.runtime }}
      SANDBOX_TEST_TMP: /tmp/sandbox-e2e
    steps:
      - name: Free disk space for container images
        run: |
          df -h
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Sandbox
        run: bun run build
      - name: Set up rootless Podman
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install --yes uidmap slirp4netns
          mkdir -p "$HOME/.config/containers"
          printf 'unqualified-search-registries = ["docker.io"]\n' > "$HOME/.config/containers/registries.conf"
          podman info
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = true
          graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          runroot=$(podman info --format '{{.Store.RunRoot}}')
          printf '[storage]\ndriver = "overlay"\ngraphroot = "%s"\nrunroot = "%s"\n' "$graphroot" "$runroot" > "$RUNNER_TEMP/podman-storage.conf"
          echo "CONTAINERS_STORAGE_CONF=$RUNNER_TEMP/podman-storage.conf" >> "$GITHUB_ENV"
      - name: Check Docker
        if: matrix.runtime == 'docker'
        run: docker info
      - name: Build test images
        env:
          SANDBOX_CONFIG_DIR: ${{ runner.temp }}/sandbox-build-config
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$SANDBOX_CONFIG_DIR"
          printf 'runtime = "%s"\n' "$SANDBOX_TEST_RUNTIME" > "$SANDBOX_CONFIG_DIR/config.toml"
          ./dist/apps/sandbox/main.js --trust --verbose build
      - name: Run end-to-end tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run test:e2e
      - name: Show runtime diagnostics
        if: failure()
        run: |
          ${{ matrix.runtime }} info
          ${{ matrix.runtime }} ps --all
          ${{ matrix.runtime }} images
          df -h

  podman-debug:
    if: ${{ inputs.podman_debug }}
    name: Temporary Podman diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      SANDBOX_TEST_RUNTIME: podman
      SANDBOX_TEST_TMP: /tmp/sandbox-e2e
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1"
      - name: Inspect storage and user mappings
        run: |
          podman info
          df -h
          podman pull docker.io/library/alpine:3
          isolated_home=$(mktemp -d)
          HOME="$isolated_home" podman info --format 'Isolated HOME store: {{.Store.GraphRoot}}'
          graphroot=$(podman info --format '{{.Store.GraphRoot}}')
          runroot=$(podman info --format '{{.Store.RunRoot}}')
          printf '[storage]\ndriver = "overlay"\ngraphroot = "%s"\nrunroot = "%s"\n' "$graphroot" "$runroot" > "$RUNNER_TEMP/podman-storage.conf"
          export CONTAINERS_STORAGE_CONF="$RUNNER_TEMP/podman-storage.conf"
          echo "CONTAINERS_STORAGE_CONF=$CONTAINERS_STORAGE_CONF" >> "$GITHUB_ENV"
          HOME="$isolated_home" podman info --format 'Shared store with isolated HOME: {{.Store.GraphRoot}}'
          HOME="$isolated_home" podman image exists docker.io/library/alpine:3
          fixture=$(mktemp -d)
          chmod 755 "$fixture"
          set +e
          podman run --rm -v "$fixture:/fixture" --user 1000 docker.io/library/alpine:3 sh -c 'id; touch /fixture/default-mapping'
          echo "Default mapping exit: $?"
          set -e
          podman run --rm --userns=keep-id:uid=1000,gid=1000 --user 0 -v "$fixture:/fixture" docker.io/library/alpine:3 sh -c 'id; ls -ldn /fixture'
          podman run --rm --userns=keep-id:uid=1000,gid=1000 --user 1000 -v "$fixture:/fixture" docker.io/library/alpine:3 sh -c 'id; touch /fixture/keep-id'
          ls -ln "$fixture"
      - name: Install and build
        run: bun install --frozen-lockfile && bun run build
      - name: Warm shared image store
        env:
          SANDBOX_CONFIG_DIR: ${{ runner.temp }}/sandbox-build-config
        run: |
          mkdir -p "$SANDBOX_CONFIG_DIR"
          printf 'runtime = "podman"\n' > "$SANDBOX_CONFIG_DIR/config.toml"
          time ./dist/apps/sandbox/main.js --trust --verbose build
      - name: Run focused stdin regression
        run: timeout 120 bun test --timeout 30000 tests/e2e/stdin.test.ts
      - name: Inspect final state
        if: always()
        run: |
          podman ps --all
          podman images
          podman system df
          df -h
