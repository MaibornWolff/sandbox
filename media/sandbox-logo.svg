    <path id="right-hand-shadow" d="M749 565 Q794 547 834 585 L845 622 Q825 650 790 641 L739 610Z" fill="#12052f" opacity=".87" filter="url(#soft-shadow)"/>
    <path id="left-hand" d="M473 542 C450 540 422 558 410 582 C398 603 406 622 425 631 C444 640 463 633 473 617 C483 601 489 596 494 611 C496 620 507 620 512 608 C519 590 515 570 505 557 C497 547 486 541 473 542Z" fill="url(#hand)" stroke="#ab91c7" stroke-width="2"/>
    <path id="right-hand" d="M774 542 C797 540 825 558 839 582 C851 603 844 622 825 631 C805 640 786 633 776 617 C766 601 760 596 756 611 C753 620 743 620 738 608 C731 590 735 570 745 557 C753 547 763 541 774 542Z" fill="url(#hand)" stroke="#ab91c7" stroke-width="2"/>
