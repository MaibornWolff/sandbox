      <circle id="right-eye" cx="691.5" cy="433.5" r="24"/>
    </g>
    <path clip-path="url(#shell-clip)" id="lower-shell-highlight" d="M507 527 Q530 541 559 540 L690 540 Q716 540 739 527" fill="none" stroke="#fff" stroke-width="7" opacity=".28" filter="url(#blur-highlight)"/>
  </g>
  <g transform="translate(5.3 0)" id="antenna" aria-label="Pink antenna with white stem">
